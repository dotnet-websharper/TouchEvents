<!DOCTYPE html>
<html lang="en">
<head>
    <title>WebSharper Touch Events Demo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234f46e5'/%3E%3Ccircle cx='8' cy='8' r='3.2' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" type="text/css" href="Content/WebSharper.TouchEvents.Sample.css" />
    <link rel="stylesheet" type="text/css" href="site.css" />
    <script type="module" src="Content/WebSharper.TouchEvents.Sample.head.js"></script>
</head>
<body>
    <main class="page">
        <header class="hero">
            <h1>Touch Events Demo</h1>
            <p class="lede">
                Drag the box with a finger or the mouse and watch the
                <a href="https://developer.mozilla.org/en-US/docs/Web/API/Touch_events" target="_blank" rel="noreferrer">Touch Events API</a>
                drive <code>touchstart</code>, <code>touchmove</code>, and <code>touchend</code>.
            </p>
        </header>

        <section class="card">
            <h2>Touch playground</h2>
            <p class="hint">The box uses <code>touch-action: none</code> so the page does not scroll while dragging.</p>
            <div class="touch-stage" id="touchStage" ws-onafterrender="TouchInit">
                <div class="touch-box" id="touchBox"></div>
            </div>
            <p class="status" role="status">${status}</p>
        </section>
    </main>
    <script type="module" src="Content/WebSharper.TouchEvents.Sample.min.js"></script>
</body>
</html>
